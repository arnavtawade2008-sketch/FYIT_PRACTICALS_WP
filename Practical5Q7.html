<!DOCTYPE html>
<html>
<head>
<title>Technology Category Validation</title>
<script>
function validateCategory()
{
var category = document.getElementById("category").value;
if(category == "")
{
alert("Please select Technology Category");
return false;
}
alert("Technology Category Selected");
return true;
}
</script>
</head>
<body>
<h2>Technology Category Form</h2>
<form onsubmit="return validateCategory()">
<label>Technology Category:</label><br><br>
<select id="category">
<option value="">-- Select Category --</option>
<option>Artificial Intelligence</option>
<option>Cloud Computing</option>
<option>Cyber Security</option>
<option>Internet of Things</option>
</select>
<br><br>
<input type="submit" value="Submit">
</form>
</body>
</html>
